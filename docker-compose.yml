services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend/storage:/app/storage
    # Load .env first (user-provided secrets), then fall back to .env.example for defaults
    env_file:
      - .env.example
      - .env
    environment:
      - FLASK_ENV=development

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000
        VITE_SOCKET_URL: http://localhost:5000
    ports:
      - "5173:4173"
    depends_on:
      - backend
